name: Build & Release Android App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_title:
        description: 'Release Title'
        required: false
        default: 'StudyForge Release'
      release_notes:
        description: 'Release Notes / Description'
        required: false
        default: 'Production release of StudyForge Study Operating System.'

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew || true

      - name: Build Android APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Prepare Release APK Artifact
        run: |
          mkdir -p release-artifacts
          # Find generated APK and copy to artifacts folder
          APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" release-artifacts/StudyForge.apk
            echo "Found APK: $APK_FILE -> copied to release-artifacts/StudyForge.apk"
          else
            echo "Error: No APK file found in build outputs"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyForge-APK
          path: release-artifacts/StudyForge.apk

      - name: Determine Release Tag & Title
        id: release_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
            echo "title=${{ github.event.inputs.release_title || github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
            echo "notes=${{ github.event.inputs.release_notes }}" >> $GITHUB_OUTPUT
          else
            TAG="${GITHUB_REF#refs/tags/}"
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "title=StudyForge $TAG" >> $GITHUB_OUTPUT
            echo "notes=Automated release for tag $TAG" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.title }}
          body: |
            ### StudyForge - Personal Learning & Study Operating System

            ${{ steps.release_info.outputs.notes }}

            #### Release Highlights
            - Offline-first personal learning operating system
            - Batch → Subject → Chapter knowledge architecture
            - Full Markdown & LaTeX math formula rendering
            - Full-screen distraction-free note viewer
            - Left/Right edge swipe-back gesture navigation
            - Question bank, smart test generator, mistake notebook, and spaced repetition flashcards
            - JSON test import & export and full offline backup

            #### Downloads
            - **StudyForge.apk**: Direct Android installation package
          files: release-artifacts/StudyForge.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
