name: Build & Release Android App

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_title:
        description: 'Release Title'
        required: false
        default: 'StudyForge Release'
      release_notes:
        description: 'Release Notes / Description'
        required: false
        default: 'Production release of StudyForge Study Operating System.'

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses & Setup Env
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license" || true
          echo "84831b9409646a3e80447306f0366590b39fb673" >> "$ANDROID_HOME/licenses/android-sdk-license" || true
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license" || true
          yes | sdkmanager --licenses || true

          # Ensure .env exists so secrets-gradle-plugin never fails
          if [ ! -f ".env" ]; then
            touch .env
            echo "Created empty .env file for build"
          fi

          # Ensure fallback dummy google-services.json if any tool checks for it
          if [ ! -f "app/google-services.json" ]; then
            mkdir -p app
            echo '{"project_info":{"project_number":"123456789","project_id":"studyforge-app","storage_bucket":"studyforge-app.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789:android:abcdef","android_client_info":{"package_name":"com.studyforge.app"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyFakeKeyForBuildOnly12345"}],"services":{"analytics_service":{"status":1}}}]}' > app/google-services.json
          fi

      - name: Ensure Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Decoded debug.keystore from debug.keystore.base64"
          fi
          if [ ! -f "debug.keystore" ]; then
            echo "Generating fallback debug.keystore"
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Ensure Gradle Wrapper
        run: |
          mkdir -p gradle/wrapper
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "gradle-wrapper.jar is missing from checkout, fetching wrapper jar..."
            curl -f -sLo gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v9.3.1/gradle/wrapper/gradle-wrapper.jar || gradle wrapper
          fi
          chmod +x gradlew || true

      - name: Build Android APK
        env:
          JAVA_OPTS: "-Djava.awt.headless=true -Dorg.gradle.jvmargs='-Xmx3072m -Djava.awt.headless=true'"
          GRADLE_OPTS: "-Djava.awt.headless=true -Dorg.gradle.jvmargs='-Xmx3072m -Djava.awt.headless=true'"
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace || gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare Release APK Artifact
        run: |
          mkdir -p release-artifacts
          # Find generated APK and copy to artifacts folder
          APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" release-artifacts/StudyForge.apk
            echo "Found APK: $APK_FILE -> copied to release-artifacts/StudyForge.apk"
          else
            echo "Error: No APK file found in build outputs"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyForge-APK
          path: release-artifacts/StudyForge.apk

      - name: Determine Release Tag & Title
        id: release_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
            echo "title=${{ github.event.inputs.release_title || github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
            echo "notes=${{ github.event.inputs.release_notes }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "title=StudyForge $TAG" >> $GITHUB_OUTPUT
            echo "notes=Automated release for tag $TAG" >> $GITHUB_OUTPUT
          else
            SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
            echo "tag=v1.0-$SHORT_SHA" >> $GITHUB_OUTPUT
            echo "title=StudyForge Build $SHORT_SHA" >> $GITHUB_OUTPUT
            echo "notes=Continuous automated build for commit $SHORT_SHA" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.title }}
          body: |
            ### StudyForge - Personal Learning & Study Operating System

            ${{ steps.release_info.outputs.notes }}

            #### Release Highlights
            - Offline-first personal learning operating system
            - Batch → Subject → Chapter knowledge architecture
            - Full Markdown & LaTeX math formula rendering
            - Full-screen distraction-free note viewer
            - Left/Right edge swipe-back gesture navigation
            - Question bank, smart test generator, mistake notebook, and spaced repetition flashcards
            - JSON test import & export and full offline backup
            - Gemini AI Assistant with auto-fallback & hidden password masking

            #### Downloads
            - **StudyForge.apk**: Direct Android installation package
          files: release-artifacts/StudyForge.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
